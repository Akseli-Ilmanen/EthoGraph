# LaDy architecture hyperparameters (HaoyuJi/LaDy, MIT).
# As with specscalpel/config/defaults.yaml, the dataset-specific keys are gone:
# the keypoint count (node), channels-per-keypoint (in_channel) and the
# generalised-coordinate dimensionality (dof) come from this run's feature
# layout and skeleton, resolved by the builder in ../../models/skeleton_graph.py.
n_features: 64
n_layers: 10
n_refine_layers: 10
n_stages: 4
n_stages_asb: 2
n_stages_brb: 3
SFI_layer: [1, 2, 3, 4, 5, 6, 7, 8, 9]
use_Friction: true      # include the learned friction term F(q, q_dot) in the dynamics
