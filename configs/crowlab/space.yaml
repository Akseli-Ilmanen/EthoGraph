# Arena geometry for space plots.
# Remove or rename this file to disable arena drawing, if you don't work in the crow lab.

arena:
  type: "polygon"           # polygon | circle
  xy_polygon:               # vertices (for polygon type)
    - [0.0, 0.0]
    - [0.5, 0.0]
    - [0.5, 0.4]
    - [0.0, 0.4]
  # center: [0.25, 0.2]   
  # radius: 0.15           
  z_bot: 0.0
  z_top: 1.0