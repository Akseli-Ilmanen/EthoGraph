[project]
name = "ethograph"
authors = [{name = "Akseli Ilmanen", email = "akseli.ilmanen@gmail.com"}]
description = "A multimodal timeseries GUI for neuroethology"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]

license = "BSD-3-Clause"
license-files = ["LICENSE"]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]

# Core dependencies — TrialTree, I/O, features, labels, and CLI
dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "netcdf4",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pynapple",
    "pyyaml",
    "crowsetta",
    "pynwb",
    "h5py",
]

[project.urls]
"Homepage" = "https://github.com/Akseli-Ilmanen/ethograph"
"Bug Tracker" = "https://github.com/Akseli-Ilmanen/ethograph/issues"
"Documentation" = "https://Akseli-Ilmanen.github.io/ethograph"
"Source Code" = "https://github.com/Akseli-Ilmanen/ethograph"
"User Support" = "https://github.com/Akseli-Ilmanen/ethograph/issues"

[project.scripts]
ethograph = "ethograph.cli:main"

[project.gui-scripts]
ethograph-gui = "ethograph.cli:launch"

[project.optional-dependencies]


# GUI: standalone pygfx/pyqtgraph graphical interface with all plot types (no audio)
gui = [
    "PyQt6",
    "qtpy",
    "pyqtgraph",
    "pygfx>=0.15.3",
    "pynaviz>=0.1",
    "rendercanvas",
    "wgpu",
    "av>=12",
    "movement>=0.14",
    "ruptures",
    "jinja2",
    "natsort",
    "tqdm",
    "nwb-video-widgets",
    "phylib>=2.6.4",
    "neo",
]

# Audio: waveform display, spectrogram, vocalisation analysis
# Linux users must first install the PortAudio system library:
#   sudo apt install libportaudio2
audio = [
    "audioio",
    "soundfile",
    "vocalpy",
    # vocalseg must be installed manually: pip install git+https://github.com/timsainb/vocalization-segmentation.git
    "sounddevice",
]

# DANDI: download datasets from the DANDI archive (heavy: ~40 transitive deps)
dandi = [
    "dandi",
]


# Development
dev = [
    "pytest",
    "pytest-cov",
    "pytest-qt",
    "coverage",
    "tox",
    "pre-commit",
    "ruff",
    "setuptools-scm",
]

# Documentation
docs = [
    "sphinx",
    "sphinx-autobuild",
    "pydata-sphinx-theme",
    "sphinx-autodoc-typehints",
    "sphinx-sitemap",
    "sphinx-design",
    "myst-nb",
    "linkify-it-py",
    "setuptools-scm",
]


[build-system]
requires = [
    "setuptools>=77",
    "wheel",
    "setuptools-scm[toml]>=8",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ethograph*"]
exclude = ["tests", "docs*"]

[tool.setuptools.package-data]
"ethograph.gui" = ["*.yaml", "assets/templates/*", "templates/*.j2"]
ethograph = ["assets/*"]

[tool.setuptools.exclude-package-data]
"ethograph.video_features" = ["checkpoint/*.pt"]

[tool.setuptools_scm]
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v*"]


[tool.pytest.ini_options]
addopts = "--cov=ethograph -m 'not slow'"
testpaths = ["tests"]
norecursedirs = ["pynaviz", "docs", "build", ".git"]
markers = [
    "slow: marks tests that require network access or take >30s (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "error",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore:Ignoring the following cached namespace:UserWarning",
    "ignore::DeprecationWarning:pynwb",
    "ignore::DeprecationWarning:hdmf",
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]

[tool.check-manifest]
ignore = [
    "*.yaml",
    "*.yml",
    "*.md",
    "*.json",
    "*.model",
    "*.txt",
    "*.ipynb",
    "tox.ini",
    "Usersaksel.pypirc",
    "tests/*",
    "docs/*",
    "configs/*",
    "scripts/*",
    "scripts/**",
    "examples/*",
    "examples/**",
    "ethograph/video_features/checkpoint/*.pt",
    ".claude/*",
]

[tool.ruff]
line-length = 120
exclude = ["__init__.py", "build", ".eggs", "scripts"]
lint.select = [
    "E",
    "F",
    "I",
]
fix = true

[tool.ruff.format]
docstring-code-format = true

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py{311,312,313}
isolated_build = True

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313

[testenv]
passenv =
    CI
    GITHUB_ACTIONS
extras =
    dev
commands =
    pytest -v --color=yes --cov=ethograph --cov-report=xml
"""

[tool.codespell]
skip = '.git,*.ipynb,docs/build/*,docs/jupyter_execute/*'
check-hidden = true
ignore-words-list = "eto,ND"
